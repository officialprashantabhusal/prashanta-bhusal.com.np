<body>
  <div class="wrap">

  <div class="lightbox" id="lightbox" aria-hidden="true">

            <button id="lbClose" class="lightbox-close" aria-label="Close">✕</button>

  <script>
    // Data copied from index.html galleryFolders
    const designGalleryBase = 'images/design gallery';
    const designGallerySrc = (fileName) => `${designGalleryBase}/${encodeURIComponent(fileName)}`;
    const galleryFolders = [
      { key: 'logo', label: 'Logo', items: [ { src: designGallerySrc('logo1.png'), title: 'Cricket Medal Badge', text: 'Ordered by the client through Malarani Mobile Centre.' }, { src: designGallerySrc('logo2.png'), title: 'Deepjyoti Sathi Sanjal', text: 'Ordered by Deepjyoti Sathi Sanjal via direct contact.' } ] },
      { key: 'banners', label: 'Banners', items: [ { src: designGallerySrc('banner1.png'), title: 'Deepjyoti Sathi Sanjal Program banner', text: 'Ordered by direct contact.' }, { src: designGallerySrc('banner2.png'), title: 'Admission banner', text: 'Ordered by Hansapur Public English Boarding School.' } ] },
      { key: 'certificates', label: 'Certificates', items: [ { src: designGallerySrc('certificate1.png'), title: 'Volleyball Certificate', text: 'Ordered by Thapkot Yuwa Samaj through Malarani Mobile Centre.' }, { src: designGallerySrc('certificate2.png'), title: 'Cricket Certificate', text: 'Ordered by New RTM Club through direct contact.' } ] },
      { key: 'birthday-frames', label: 'Birthday Frames', items: [ { src: designGallerySrc('Birthdayframe -malarani mobile client project.png'), title: 'Happy Birthday (Calendar design)', text: 'Ordered by Malarani Mobile Centre.' }, { src: designGallerySrc('frame--first blessing.png'), title: '1st Birthday Viral Frame', text: 'Ordered by Malarani Mobile Centre.' } ] },
      { key: 'flyers', label: 'Flyers', items: [ { src: designGallerySrc('flyer1.png'), title: 'Lenevo Legion 5', text: 'Designed in internship program.' }, { src: designGallerySrc('flyer2.png'), title: 'Xtrike Me Transparent Mouse', text: 'Designed during internship.' } ] },
      { key: 'presentation', label: 'Presentation', items: [ { src: designGallerySrc('presentation1.png'), title: 'Butwal Hacks Attendance System', text: 'Design and Presented in class 10 Technical Project', href: 'https://canva.link/nbg97dptjctne5g', external: true } ] },
      { key: 'others', label: 'Others', items: [ { src: designGallerySrc('others1.png'), title: 'Bibaha Card', text: 'Design for Class 10 Nepali Project Work' }, { src: designGallerySrc('others2.png'), title: 'Website launched', text: 'Ordered by Hansapur Public English Boarding School.' } ] }

    const galleryNepali = {
      Logo: 'लोगो', Banners: 'ब्यानरहरू', Certificates: 'प्रमाणपत्रहरू', 'Birthday Frames': 'जन्मदिनका फ्रेमहरू',
      Flyers: 'फ्लायरहरू', Presentation: 'प्रस्तुति', Others: 'अन्य',
      'Cricket Medal Badge': 'क्रिकेट पदक ब्याज', 'Deepjyoti Sathi Sanjal': 'दीपज्योति साथी सञ्जाल',
      'Deepjyoti Sathi Sanjal Program banner': 'दीपज्योति साथी सञ्जाल कार्यक्रमको ब्यानर', 'Admission banner': 'भर्ना ब्यानर',
      'Volleyball Certificate': 'भलिबल प्रमाणपत्र', 'Cricket Certificate': 'क्रिकेट प्रमाणपत्र',
      'Happy Birthday (Calendar design)': 'जन्मदिनको शुभकामना (क्यालेन्डर डिजाइन)', '1st Birthday Viral Frame': 'पहिलो जन्मदिनको भाइरल फ्रेम',
      'Lenevo Legion 5': 'लेनोभो लिजन ५', 'Xtrike Me Transparent Mouse': 'एक्सट्राइक मी पारदर्शी माउस',
      'Butwal Hacks Attendance System': 'बुटवल ह्याक्स हाजिरी प्रणाली', 'Bibaha Card': 'विवाह कार्ड', 'Website launched': 'वेबसाइट सार्वजनिक',
      'Ordered by the client through Malarani Mobile Centre.': 'मालारानी मोबाइल सेन्टरमार्फत ग्राहकले अर्डर गर्नुभएको।',
      'Ordered by Deepjyoti Sathi Sanjal via direct contact.': 'प्रत्यक्ष सम्पर्कमार्फत दीपज्योति साथी सञ्जालले अर्डर गर्नुभएको।',
      'Ordered by direct contact.': 'प्रत्यक्ष सम्पर्कमार्फत अर्डर गरिएको।',
      'Ordered by Hansapur Public English Boarding School.': 'हंसपुर पब्लिक इङ्लिस बोर्डिङ स्कुलले अर्डर गर्नुभएको।',
      'Ordered by Thapkot Yuwa Samaj through Malarani Mobile Centre.': 'मालारानी मोबाइल सेन्टरमार्फत थापकोट युवा समाजले अर्डर गर्नुभएको।',
      'Ordered by New RTM Club through direct contact.': 'प्रत्यक्ष सम्पर्कमार्फत न्यू आरटीएम क्लबले अर्डर गर्नुभएको।',
      'Ordered by Malarani Mobile Centre.': 'मालारानी मोबाइल सेन्टरले अर्डर गर्नुभएको।',
      'Designed in internship program.': 'इन्टर्नसिप कार्यक्रममा डिजाइन गरिएको।', 'Designed during internship.': 'इन्टर्नसिपका क्रममा डिजाइन गरिएको।',
      'Design and Presented in class 10 Technical Project': 'कक्षा १० को प्राविधिक परियोजनामा डिजाइन र प्रस्तुत गरिएको।',
      'Design for Class 10 Nepali Project Work': 'कक्षा १० को नेपाली परियोजना कार्यका लागि डिजाइन।'
    };

    const folderButtons = document.getElementById('folderButtons');
    const grid = document.getElementById('grid');
    const search = document.getElementById('search');
    const empty = document.getElementById('empty');

    let activeKey = galleryFolders[0].key;
    let itemsFlat = [];

    const activeFolderLabel = document.getElementById('activeFolderLabel');
    const resultLabel = document.getElementById('resultLabel');
    let galleryLanguage = localStorage.getItem('preferredLanguage') === 'ne' ? 'ne' : 'en';
    const t = (value) => galleryLanguage === 'ne' ? (galleryNepali[value] || value) : value;

    function applyGalleryLanguage() {
      const isNepali = galleryLanguage === 'ne';
      const title = document.querySelector('.title');
      if (title) title.textContent = isNepali ? title.dataset.ne : title.dataset.en;
      document.querySelectorAll('[data-en][data-ne]').forEach((element) => {
        if (element.classList.contains('title')) return;
        element.textContent = isNepali ? element.dataset.ne : element.dataset.en;
      });
      document.querySelectorAll('[data-placeholder-en][data-placeholder-ne]').forEach((element) => {
        element.placeholder = isNepali ? element.dataset.placeholderNe : element.dataset.placeholderEn;
      });
      document.querySelectorAll('[data-aria-en][data-aria-ne]').forEach((element) => {
        element.setAttribute('aria-label', isNepali ? element.dataset.ariaNe : element.dataset.ariaEn);
      });
      document.querySelectorAll('[data-label-en][data-label-ne]').forEach((element) => {
        element.textContent = isNepali ? element.dataset.labelNe : element.dataset.labelEn;
      });
      document.querySelectorAll('.folder').forEach((button) => {
        const folder = galleryFolders.find((item) => item.key === button.dataset.key);
        if (folder) button.textContent = t(folder.label);
      });
      const languageSwitch = document.getElementById('languageSwitch');
      if (languageSwitch) {
        languageSwitch.textContent = isNepali ? 'ने' : 'ENG';
        languageSwitch.setAttribute('aria-label', isNepali ? 'अङ्ग्रेजीमा बदल्नुहोस्' : 'Switch to Nepali');
      }
      document.title = isNepali
        ? 'प्रशान्त भुसाल | ग्राफिक डिजाइन ग्यालरी'
        : 'Prashanta Bhusal | Graphic Design Gallery';
    }

    function build() {
      // populate folder buttons
      folderButtons.innerHTML = '';
      galleryFolders.forEach((f) => {
        const btn = document.createElement('button');
        btn.className = 'folder';
        btn.textContent = t(f.label);
        btn.dataset.key = f.key;
        if (f.key === activeKey) btn.classList.add('active');
        btn.addEventListener('click', () => { activeKey = f.key; document.querySelectorAll('.folder').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); render(); });
        folderButtons.appendChild(btn);
      });

      // flatten items with folder reference
      itemsFlat = galleryFolders.flatMap(f => f.items.map(it => ({...it, folder: f.key, folderLabel: f.label}))); 
      render();
    }

    function render() {
      const q = (search.value || '').trim().toLowerCase();
      const folder = activeKey;
      const filtered = itemsFlat.filter(it => it.folder === folder && ((it.title + ' ' + it.text + ' ' + t(it.title) + ' ' + t(it.text)).toLowerCase().includes(q)));
      grid.innerHTML = '';
      if (filtered.length === 0) { empty.style.display='block'; } else { empty.style.display='none'; }
      const activeFolder = galleryFolders.find(f => f.key === folder);
      activeFolderLabel.textContent = activeFolder ? t(activeFolder.label) : '';
      resultLabel.textContent = q
        ? (galleryLanguage === 'ne' ? `"${search.value.trim()}" का लागि ${filtered.length} नतिजा` : `${filtered.length} results for "${search.value.trim()}"`)
        : (galleryLanguage === 'ne' ? `${filtered.length} डिजाइन` : `${filtered.length} designs`);
        filtered.forEach((it, i) => {
          const card = document.createElement('article');
          card.className = 'card' + (it.folder === 'presentation' ? ' presentation' : '');
          card.innerHTML = `
            <div class="inner">
              <div class="img-wrap">
                <img loading="lazy" src="${it.src}" alt="${t(it.title)}">
              </div>
              <div class="card-body">
                <h4 class="card-title">${t(it.title)}</h4>
                <p class="card-text">${t(it.text)}</p>
                <div class="card-actions">
                  <button class="btn" type="button" aria-label="${galleryLanguage === 'ne' ? `पूर्वावलोकन ${t(it.title)}` : `Preview ${it.title}`}">${galleryLanguage === 'ne' ? 'पूर्वावलोकन' : 'Preview'}</button>
                  <a class="btn primary" href="${it.src}" download="${it.title}">${galleryLanguage === 'ne' ? 'डाउनलोड' : 'Download'}</a>
                </div>
              </div>
            </div>
          `;
          grid.appendChild(card);
          // open lightbox on card click
          card.addEventListener('click', (event) => {
            if (event.target.closest('a, button')) return;
            openLightbox(filtered, i);
          });
          card.querySelector('button').addEventListener('click', () => openLightbox(filtered, i));
        });
    }

    // Lightbox
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    const lbTitle = document.getElementById('lbTitle');
    const lbText = document.getElementById('lbText');
    const lbClose = document.getElementById('lbClose');
    const lbDownload = document.getElementById('lbDownload');
    const lbExternal = document.getElementById('lbExternal');
    const lbFolder = document.getElementById('lbFolder');
    const btnPrev = document.getElementById('prev');
    const btnNext = document.getElementById('next');

    let lbList = [];
    // lightbox transform state
    let scale = 1, minScale = 1, maxScale = 4, startX = 0, startY = 0, translateX = 0, translateY = 0, isPanning = false;
    const lbZoom = document.getElementById('lbZoom');
    const lbFit = document.getElementById('lbFit');

    function applyTransform(){ lbImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`; }
    function resetTransform(){ scale = 1; translateX = 0; translateY = 0; lbImg.classList.remove('zoomed'); applyTransform(); lbImg.style.cursor = 'zoom-in'; }

    function openLightbox(list, idx){ lbList = list; currentIndex = idx; showCurrent(); lb.classList.add('show'); lb.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; }
    function closeLightbox(){ lb.classList.remove('show'); lb.setAttribute('aria-hidden','true'); document.body.style.overflow=''; resetTransform(); }
    function showCurrent(){ const it = lbList[currentIndex]; if(!it) return; lbImg.src = it.src; lbImg.alt = t(it.title); lbTitle.textContent = t(it.title); lbText.textContent = t(it.text); lbFolder.textContent = it.folderLabel ? t(it.folderLabel) : (galleryLanguage === 'ne' ? 'पूर्वावलोकन' : 'Preview'); lbDownload.href = it.src; lbExternal.style.display = it.href ? 'inline-flex' : 'none'; if(it.href) lbExternal.href = it.href; resetTransform(); }
    function prev(){ currentIndex = (currentIndex-1+lbList.length)%lbList.length; showCurrent(); }
    function next(){ currentIndex = (currentIndex+1)%lbList.length; showCurrent(); }

    // zoom toggle
    lbZoom.addEventListener('click', ()=>{
      if(scale > 1){ resetTransform(); } else { scale = 2; lbImg.classList.add('zoomed'); lbImg.style.cursor='grab'; applyTransform(); }
    });
    lbFit.addEventListener('click', ()=>{ resetTransform(); });

    // double-click to toggle zoom
    lbImg.addEventListener('dblclick', (e)=>{ if(scale>1) resetTransform(); else { scale=2; lbImg.classList.add('zoomed'); lbImg.style.cursor='grab'; applyTransform(); } });

    // wheel to zoom
    lbImg.addEventListener('wheel', (e)=>{
      if(!e.ctrlKey){ e.preventDefault(); const delta = -e.deltaY * 0.0015; const newScale = Math.min(maxScale, Math.max(minScale, scale + delta)); if(newScale===scale) return; // adjust translate so zoom centers at cursor
        const rect = lbImg.getBoundingClientRect(); const cx = e.clientX - rect.left; const cy = e.clientY - rect.top; const dx = (cx - rect.width/2 - translateX) / scale; const dy = (cy - rect.height/2 - translateY) / scale; translateX -= dx * (newScale - scale); translateY -= dy * (newScale - scale); scale = newScale; lbImg.classList.toggle('zoomed', scale>1); applyTransform(); }
    }, { passive:false });

    // drag to pan when zoomed
    lbImg.addEventListener('mousedown', (e)=>{ if(scale<=1) return; isPanning=true; startX = e.clientX - translateX; startY = e.clientY - translateY; lbImg.style.cursor='grabbing'; e.preventDefault(); });
    window.addEventListener('mousemove', (e)=>{ if(!isPanning) return; translateX = e.clientX - startX; translateY = e.clientY - startY; applyTransform(); });
    window.addEventListener('mouseup', ()=>{ if(isPanning){ isPanning=false; lbImg.style.cursor='grab'; } });


    lbClose.addEventListener('click', closeLightbox);
    btnPrev.addEventListener('click', prev);
    btnNext.addEventListener('click', next);
    lb.addEventListener('click', (e)=>{ if(e.target===lb) closeLightbox(); });
    document.addEventListener('keydown', (e)=>{ if(lb.classList.contains('show')){ if(e.key==='ArrowLeft') prev(); if(e.key==='ArrowRight') next(); if(e.key==='Escape') closeLightbox(); } });

    search.addEventListener('input', render);
    document.getElementById('languageSwitch').addEventListener('click', () => {
      galleryLanguage = galleryLanguage === 'ne' ? 'en' : 'ne';
      try { localStorage.setItem('preferredLanguage', galleryLanguage); } catch (error) { console.warn('Gallery language preference could not be saved', error); }
      applyGalleryLanguage();
      render();
      if (lb.classList.contains('show')) showCurrent();
    });

    // initialize
    applyGalleryLanguage();
    build();

    // ensure responsiveness on resize: nothing required but keep images crisp
    window.addEventListener('resize', ()=>{});
  </script>
</body>
</html>
